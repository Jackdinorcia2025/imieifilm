<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>I Miei Film</title>

<style>
body {
    margin: 0;
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 40px;
    background: #000;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    color: #e50914;
}

.hero {
    padding: 70px 40px;
    background: linear-gradient(135deg,#222,#050505);
}

.hero h1 {
    font-size: 48px;
    margin: 0;
}

.hero p {
    color: #bbb;
    font-size: 19px;
}

.contenuto {
    padding: 30px 40px;
}

h2 {
    margin-bottom: 25px;
}

.film {
    width: 300px;
    background: #181818;
    border-radius: 10px;
    overflow: hidden;
    transition: .25s;
}

.film:hover {
    transform: scale(1.04);
}

.copertina {
    height: 170px;
    background: linear-gradient(135deg,#333,#111);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
}

.info {
    padding: 18px;
}

.info h3 {
    margin-top: 0;
}

.info p {
    color: #aaa;
}

button {
    background: white;
    color: black;
    border: 0;
    padding: 11px 20px;
    border-radius: 5px;
    font-weight: bold;
    cursor: pointer;
}

footer {
    color: #666;
    padding: 50px 40px;
    text-align: center;
}
</style>

</head>

<body>

<header>
    <div class="logo">I MIEI FILM</div>
</header>

<section class="hero">
    <h1>Le mie parodie 🎬</h1>
    <p>Film, videoclip e scene rivisitate a modo mio.</p>
</section>

<section class="contenuto">

<h2>Ultime parodie</h2>

<div class="film">

    <div class="copertina">🎬</div>

    <div class="info">
        <h3>Il mio primo video</h3>

        <p>La prima parodia della raccolta.</p>

        <button>▶ GUARDA</button>
    </div>

</div>

</section>

<footer>
I MIEI FILM • Parodie e video
</footer>

</body>
</html>
